<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NexusJobs - Find Jobs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-theme="dark"><div class="ambient-glow glow-top-left"></div><div class="ambient-glow glow-top-right"></div><header class="navbar-header"><a href="index.html" class="brand"><div class="brand-icon"><i class="ri-flashlight-fill"></i></div><span>Nexus<strong>Jobs</strong></span></a><div class="header-actions"><button id="theme-btn" class="icon-btn"><i class="ri-sun-line" id="theme-icon"></i></button><a href="auth.html" class="login-pill-btn"><i class="ri-user-line"></i><span>Sign In</span></a></div></header><main class="content-wrapper"><section class="explore-hero"><div class="badge-pill"><span class="pulse-dot"></span> 2,400+ roles live today</div><h1 class="explore-heading">Find your next <span class="gradient-text">high-impact role</span>.</h1><p class="hero-subtitle">Search engineering, product, design, AI and growth opportunities from ambitious teams.</p><div class="search-island"><div class="search-field-wrapper"><div class="search-field"><i class="ri-search-2-line"></i><input id="jobSearch" placeholder="Search title, skill or company..."></div></div><div class="search-field-wrapper"><div class="search-field"><i class="ri-map-pin-line"></i><input id="locationSearch" placeholder="Remote / city"></div></div></div></section><div class="filter-strip"><button class="chip active">All Jobs</button><button class="chip">Remote</button><button class="chip">Engineering</button><button class="chip">Design</button><button class="chip">Product</button><button class="chip">AI / ML</button></div><section class="explore-section"><div class="feed-header"><h2>Recommended openings</h2><span class="view-all">128 jobs</span></div><div class="cards-grid" id="job-results"></div></section></main><script src="javascript.js"></script><script>const jobs=[['Senior Frontend Architect','Synthetix AI','Remote · India','ri-brain-line','bg-purple','₹28–40 LPA'],['Product Designer','Lumen Labs','Mumbai · Hybrid','ri-shape-2-line','bg-emerald','₹18–28 LPA'],['AI Engineer','Vertex Intelligence','Bengaluru · Remote','ri-cpu-line','bg-purple','₹30–45 LPA'],['Backend Engineer','Cloudline','Pune · Hybrid','ri-server-line','bg-emerald','₹22–34 LPA'],['Growth Product Manager','NovaScale','Remote · India','ri-rocket-line','bg-purple','₹24–36 LPA']];const root=document.getElementById('job-results');function render(q=''){root.innerHTML=jobs.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(x=>`<a class="job-card" href="job-details.html"><div class="card-top"><div class="company-logo ${x[4]}"><i class="${x[3]}"></i></div><div class="meta-info"><h3>${x[0]}</h3><p>${x[1]} <span class="dot">•</span> ${x[2]}</p></div><button class="bookmark-btn" onclick="event.preventDefault()"><i class="ri-bookmark-line"></i></button></div><p class="job-desc">Build polished products with a high-ownership team and strong design culture.</p><div class="tags"><span class="tag">Full-time</span><span class="tag">High match</span><span class="tag">${x[5]}</span></div></a>`).join('')||'<div class="job-card"><h3>No roles found</h3><p class="job-desc">Try another title or skill.</p></div>'}render();document.getElementById('jobSearch').addEventListener('input',e=>render(e.target.value));</script></body></html>
